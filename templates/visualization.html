<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Logs Visualization</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1 style="text-align: center;">Logs Data Visualization</h1>

    <!-- 1. Log Level Distribution Pie -->
    <h3>Log Level Distribution</h3>
    <canvas id="logLevelPie"></canvas>

    <!-- 2. Methods Bar -->
    <h3>Method Usage</h3>
    <canvas id="methodBar"></canvas>

    <!-- 3. Message Type Count -->
    <h3>Message Types</h3>
    <canvas id="messageTypeBar"></canvas>

    <!-- 4. Top 5 Model Objects -->
    <h3>Top 5 Model Objects</h3>
    <canvas id="modelObjectBar"></canvas>

    <!-- 5. Logs Over Time -->
    <h3>Logs Over Time</h3>
    <canvas id="logOverTime"></canvas>

    <script id="rows-data" type="application/json">
        {{ rows|tojson|safe }}
    </script>


    <script>
        const rows = JSON.parse(document.getElementById('rows-data').textContent);
        const logLevels = {};
        const methods = {};
        const messageTypes = {};
        const modelObjects = {};
        const logTimeSeries = {};

        rows.forEach(row => {
            // 1. Log Level Pie
            logLevels[row.log_level] = (logLevels[row.log_level] || 0) + 1;

            // 2. Method Bar
            methods[row.method] = (methods[row.method] || 0) + 1;

            // 3. Message Types
            if (row.message_type)
                messageTypes[row.message_type] = (messageTypes[row.message_type] || 0) + 1;

            // 4. Model Objects
            if (row.model_object)
                modelObjects[row.model_object] = (modelObjects[row.model_object] || 0) + 1;

            // 5. Time Series
            const dateStr = row.log_date;
            logTimeSeries[dateStr] = (logTimeSeries[dateStr] || 0) + 1;
        });

        // Function for drawing pie chart
        function drawPieChart(ctx, labels, data) {
            new Chart(ctx, {
                type: 'pie',
                data: { labels: labels, datasets: [{ data: data }] }
            });
        }

        // Function for bar chart
        function drawBarChart(ctx, labels, data) {
            new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: data }] }
            });
        }

        // Draw charts
        drawPieChart(document.getElementById('logLevelPie'), Object.keys(logLevels), Object.values(logLevels));
        drawBarChart(document.getElementById('methodBar'), Object.keys(methods), Object.values(methods));
        drawBarChart(document.getElementById('messageTypeBar'), Object.keys(messageTypes), Object.values(messageTypes));

        // Top 5 model objects
        const topModelObjects = Object.entries(modelObjects).sort((a,b) => b[1]-a[1]).slice(0,5);
        drawBarChart(document.getElementById('modelObjectBar'), topModelObjects.map(e => e[0]), topModelObjects.map(e => e[1]));

        // Line Chart for time
        const sortedDates = Object.keys(logTimeSeries).sort();
        const counts = sortedDates.map(d => logTimeSeries[d]);
        new Chart(document.getElementById('logOverTime'), {
            type: 'line',
            data: { labels: sortedDates, datasets: [{ data: counts, label: 'Logs Over Time' }] }
        });

    </script>
</body>
</html>
