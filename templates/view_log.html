<!DOCTYPE html>
<html>
<head>
    <title>{{ filename }}</title>
    <style>
        pre { white-space: pre-wrap; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; }
        td { border: 1px solid #ccc; padding: 4px; }
    </style>
</head>
<body>
    <h2>{{ filename }}</h2>
    <table>
        <tbody>
            {% for line in lines %}
            <tr>
                <td><pre>{{ line }}</pre></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
